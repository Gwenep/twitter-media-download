# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go CI/CD

env:
  AUTH_TOKEN: ${{secrets.AUTH_TOKEN}}
  CT0: ${{secrets.CT0}}

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{matrix.os}}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod 里的 1.22.3 在 macOS 15 runner 上会生成 dyld 报错
          # (missing LC_UUID load command) 的测试二进制，这里改用最新稳定版。
          go-version: 'stable'

      
      - name: Build for Win
        if: ${{'windows-latest' == matrix.os}}
        run: |
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -o bin/tmd-${{ runner.os }}-amd64.exe -v -ldflags "-w -s" .
          
      - name: Build for Unix
        if: ${{'windows-latest' != matrix.os}}
        run: |
          GOARCH=amd64 CGO_ENABLED=0 go build -o bin/tmd-${{ runner.os }}-amd64 -v -ldflags "-w -s" .
      
      - name: Test
        if: ${{!startsWith(github.ref, 'refs/tags/v')}}
        run: go test ./...

      - name: Test (race)
        if: ${{!startsWith(github.ref, 'refs/tags/v') && 'ubuntu-latest' == matrix.os}}
        run: go test -race ./...
        
      - name: Upload build artifact
        if: ${{!startsWith(github.ref, 'refs/tags/v')}}
        uses: actions/upload-artifact@v4
        with:
          name: tmd-${{ matrix.os }}
          path: ./bin/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./bin/*
          generate_release_notes: true
